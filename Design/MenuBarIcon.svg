<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
<!-- Pressing Menu's menu-bar icon, connected and idle: a stylised record, no
     brush, as a template image, black on transparent. macOS tints it. The
     rim, one groove, and the label with its spindle hole. -->
<defs>
  <mask id="hole">
    <rect width="18" height="18" fill="#fff"/>
    <circle cx="9" cy="9" r="0.85" fill="#000"/>
  </mask>
</defs>
<circle cx="9" cy="9" r="7.25" fill="none" stroke="#000" stroke-width="1.5"/>
<circle cx="9" cy="9" r="4.9" fill="none" stroke="#000" stroke-width="0.7"/>
<circle cx="9" cy="9" r="2.6" fill="#000" mask="url(#hole)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
<!-- Pressing Menu's menu-bar icon while a Record plays: MenuBarIcon.svg with
     the record filled in, its label edge and spindle hole cut out. -->
<defs>
  <mask id="cut">
    <rect width="18" height="18" fill="#fff"/>
    <!-- Clear space around the brush, the label's edge and the spindle hole. -->
    <rect x="2.3" y="3.5" width="11.9" height="5.2" rx="2.4" transform="rotate(-20 8.25 6.1)" fill="#000"/>
    <circle cx="10" cy="10.5" r="2.9" fill="none" stroke="#000" stroke-width="0.9"/>
    <circle cx="10" cy="10.5" r="0.8" fill="#000"/>
  </mask>
</defs>
<circle cx="10" cy="10.5" r="7.35" fill="#000" mask="url(#cut)"/>
<rect x="3.4" y="4.6" width="9.7" height="3" rx="1.3" transform="rotate(-20 8.25 6.1)" fill="#000"/>
</svg>

# Xcode project definition. Generate Pressing.xcodeproj with `xcodegen generate`;
# the .xcodeproj itself is not checked in.
name: Pressing

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
  createIntermediateGroups: true
  # LAME is a build output, not checked in: build it the first time (ADR-0002).
  preGenCommand: scripts/build-lame.sh --if-missing

packages:
  PressingCore:
    path: PressingCore

targets:
  Pressing:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: PressingCore
      - framework: Vendor/LAME.xcframework
        embed: false
    scheme: {}
    settings:
      base:
        # Bundle ID and team come from Config/Signing.xcconfig, never from here.
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        # Rendered from Design/AppIcon.svg into App/Resources/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated Info.plist: only keys INFOPLIST_KEY_ can't express.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pressing
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pressing listens to your record deck's USB input so it can play the Record in your Sonos Rooms. It only uses the input you choose in Settings."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Pressing finds your Sonos Rooms and plays your Record to them over your home network, and shows what's playing in Pressing Menu on your Mac."
        # The launch screen is defined in App/Info.plist (the start screen's artwork).
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  # Pressing Menu: the Mac menu-bar app that shows and controls a Pressing on
  # the same network (ADR-0004). No LAME, no Sonos: it only talks to the phone.
  PressingMenu:
    type: application
    platform: macOS
    sources:
      - Menu/Sources
      # Shared with the iPhone app: it imports only Foundation and PressingCore.
      - App/Sources/Adapters/MainQueueScheduler.swift
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: PressingCore
        product: PressingCore
      - package: PressingCore
        product: PressingMenuCore
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Pressing Menu
        PRODUCT_MODULE_NAME: PressingMenu
        # A bundle ID of its own, next to the iPhone app's (Config/Signing.xcconfig).
        PRODUCT_BUNDLE_IDENTIFIER: $(PRESSING_BUNDLE_ID).menu
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Menu/PressingMenu.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Menu/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pressing Menu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        # A menu-bar extra: no Dock icon and no main menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Pressing Menu finds Pressing on your iPhone over your home network, to show what's playing."

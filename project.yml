# Xcode project definition. Generate FirstPress.xcodeproj with `xcodegen generate`;
# the .xcodeproj itself is not checked in.
name: FirstPress

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
  createIntermediateGroups: true
  # LAME is a build output, not checked in: build it the first time (ADR-0002).
  preGenCommand: scripts/build-lame.sh --if-missing

# One build number for both apps, so First Press and First Press Menu always
# ship with the same one. Raise it here before every upload, from Xcode or not.
settings:
  base:
    CURRENT_PROJECT_VERSION: "4"

packages:
  FirstPressCore:
    path: FirstPressCore

targets:
  FirstPress:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: FirstPressCore
      - framework: Vendor/LAME.xcframework
        embed: false
    scheme: {}
    settings:
      base:
        # Bundle ID and team come from Config/Signing.xcconfig, never from here.
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # Rendered from Design/AppIcon.svg into App/Resources/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated Info.plist: only keys INFOPLIST_KEY_ can't express.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: First Press
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "First Press listens to your record deck's USB input so it can play the Record in your Sonos Rooms. It only uses the input you choose in Settings."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "First Press finds your Sonos Rooms and plays your Record to them over your home network, and shows what's playing in First Press Menu on your Mac."
        # The launch screen is defined in App/Info.plist (the start screen's artwork).
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  # First Press Menu: the Mac menu-bar app that shows and controls a First Press on
  # the same network (ADR-0004). No LAME, no Sonos: it only talks to the phone.
  FirstPressMenu:
    type: application
    platform: macOS
    sources:
      - Menu/Sources
      - Menu/Resources
      # Shared with the iPhone app: they import only Foundation, Network and
      # FirstPressCore.
      - App/Sources/Adapters/MainQueueScheduler.swift
      - App/Sources/Adapters/MenuNetwork.swift
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: FirstPressCore
        product: FirstPressCore
      - package: FirstPressCore
        product: FirstPressMenuCore
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: First Press Menu
        PRODUCT_MODULE_NAME: FirstPressMenu
        # A bundle ID of its own, next to the iPhone app's (Config/Signing.xcconfig).
        PRODUCT_BUNDLE_IDENTIFIER: $(FIRSTPRESS_BUNDLE_ID)-menu
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Menu/FirstPressMenu.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        # Rendered from Design/MenuAppIcon.svg by scripts/render-menu-artwork.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Menu/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: First Press Menu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        # A menu-bar extra: no Dock icon and no main menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "First Press Menu finds First Press on your iPhone over your home network, to show what's playing."
